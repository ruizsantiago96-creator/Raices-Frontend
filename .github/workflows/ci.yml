name: CI - Frontend

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias con lockfile congelado
        run: pnpm install --frozen-lockfile

      - name: Revisar estilo y calidad (Lint)
        run: pnpm run lint

      - name: Auditoría de seguridad de dependencias
        run: pnpm audit --audit-level=critical

      - name: Ejecutar suite de pruebas
        run: pnpm test -- --run

      - name: Compilar para producción (Build)
        run: pnpm run build